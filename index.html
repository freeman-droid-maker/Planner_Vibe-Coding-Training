<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>내 업무 플래너</title>
  <meta name="description" content="개인 업무를 등록하고 마감일과 완료 상태를 로컬에 안전하게 관리하는 직관적인 한국어 업무용 플래너" />
  <meta property="og:title" content="내 업무 플래너" />
  <meta property="og:description" content="개인 업무를 등록하고 마감일과 완료 상태를 관리하는 간결한 업무용 플래너" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    /* CSS Reset & Variables */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Primary Blue Accent */
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-active: #1e40af;
      --primary-light: #eff6ff;
      --primary-ring: rgba(37, 99, 235, 0.2);
      
      /* Backgrounds */
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --bg-hover: #f1f5f9;
      
      /* Typography & Text */
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      /* Borders */
      --border-color: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-focus: #2563eb;
      
      /* Priority colors */
      --priority-high-bg: #fef2f2;
      --priority-high-text: #b91c1c;
      --priority-high-border: #fecaca;
      
      --priority-normal-bg: #eff6ff;
      --priority-normal-text: #1d4ed8;
      --priority-normal-border: #bfdbfe;
      
      --priority-low-bg: #f0fdf4;
      --priority-low-text: #15803d;
      --priority-low-border: #bbf7d0;
      
      /* Status colors */
      --status-overdue-bg: #fef2f2;
      --status-overdue-text: #dc2626;
      --status-overdue-border: #fca5a5;
      
      --status-today-bg: #eff6ff;
      --status-today-text: #2563eb;
      --status-today-border: #93c5fd;
      
      --status-done-bg: #f1f5f9;
      --status-done-text: #64748b;
      --status-done-border: #cbd5e1;

      /* Radii */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.08), 0 4px 8px -3px rgba(15, 23, 42, 0.04);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      word-break: keep-all;
    }

    .app-container {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 56px;
      flex: 1;
    }

    /* ==========================================================================
       Header
       ========================================================================== */
    header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
    }

    .brand-title {
      font-size: 1.625rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      line-height: 1.25;
    }

    .brand-subtitle {
      font-size: 0.9375rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 450;
    }

    /* Stats Summary */
    .stats-summary {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stat-pill {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .stat-pill strong {
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.875rem;
    }

    .stat-pill.pill-overdue {
      background: var(--status-overdue-bg);
      border-color: var(--status-overdue-border);
      color: var(--status-overdue-text);
    }
    .stat-pill.pill-overdue strong {
      color: var(--status-overdue-text);
    }

    .stat-pill.pill-today {
      background: var(--status-today-bg);
      border-color: var(--status-today-border);
      color: var(--status-today-text);
    }
    .stat-pill.pill-today strong {
      color: var(--status-today-text);
    }

    /* Storage Notice (Requirement) */
    .storage-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      color: #334155;
      font-size: 0.8125rem;
      line-height: 1.45;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-top: 20px;
      border-left: 4px solid var(--primary);
    }

    .storage-notice svg {
      flex-shrink: 0;
      color: var(--primary);
    }

    /* Storage Error Banner */
    .storage-error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: #fef2f2;
      border: 1px solid #f87171;
      color: #991b1b;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      animation: fadeIn 0.2s ease-out;
    }

    .storage-error-banner.show {
      display: flex;
    }

    /* ==========================================================================
       Card Styles (Distinct Input Card & List Card)
       ========================================================================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* Special accent for the registration card to clearly separate it from list */
    .card-registration {
      border-top: 4px solid var(--primary);
      box-shadow: var(--shadow-md);
    }

    .card-list {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
    }

    .card-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.01em;
    }

    .card-title svg {
      color: var(--primary);
      flex-shrink: 0;
    }

    .card-badge-pill {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--primary-ring);
    }

    /* ==========================================================================
       Form Controls & Inputs
       ========================================================================== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .form-label .required {
      color: #dc2626;
      margin-left: 4px;
    }

    .form-label .optional {
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .input-text, .input-select, .input-date {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 0.9375rem;
      color: var(--text-main);
      background: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .input-text::placeholder {
      color: #94a3b8;
    }

    .input-text:focus, .input-select:focus, .input-date:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3.5px var(--primary-ring);
    }

    .input-text.has-error {
      border-color: #ef4444;
      background-color: #fffbfa;
    }

    .input-text.has-error:focus {
      box-shadow: 0 0 0 3.5px rgba(239, 68, 68, 0.2);
    }

    .error-feedback {
      display: none;
      color: #dc2626;
      font-size: 0.84375rem;
      margin-top: 8px;
      font-weight: 600;
      align-items: center;
      gap: 6px;
    }

    .error-feedback.show {
      display: flex;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    /* Date Shortcuts - Mobile Friendly Wrap */
    .date-shortcuts {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .shortcut-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-body);
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      white-space: nowrap;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .shortcut-btn:hover {
      background: var(--primary-light);
      border-color: #93c5fd;
      color: var(--primary);
    }

    .shortcut-btn.clear-btn {
      color: #64748b;
    }
    .shortcut-btn.clear-btn:hover {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #dc2626;
    }

    /* Buttons */
    .btn {
      min-height: 48px;
      padding: 0 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      font-family: inherit;
      text-decoration: none;
      user-select: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      width: 100%;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:active {
      background-color: var(--primary-active);
    }

    /* ==========================================================================
       Toolbar: Filters & Sort Controls
       ========================================================================== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-tabs-wrapper {
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .filter-tabs {
      display: inline-flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 2px;
    }

    .filter-tab {
      background: transparent;
      border: none;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: calc(var(--radius-md) - 4px);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .filter-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .filter-tab:hover:not(.active) {
      color: var(--text-main);
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .sort-label {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .sort-select {
      height: 40px;
      padding: 0 14px;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #ffffff;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .sort-select:focus {
      border-color: var(--border-focus);
    }

    /* ==========================================================================
       Task List Items & Cards
       ========================================================================== */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px 22px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: all 0.15s ease;
      position: relative;
    }

    .task-item:hover {
      border-color: var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    /* Completed Task Styling: clear checkbox & line-through */
    .task-item.is-completed {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    /* Custom Accessible Checkbox */
    .checkbox-container {
      position: relative;
      padding-top: 2px;
      flex-shrink: 0;
    }

    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid #94a3b8;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      outline: none;
    }

    .custom-checkbox:hover {
      border-color: var(--primary);
    }

    .custom-checkbox:focus {
      box-shadow: 0 0 0 3.5px var(--primary-ring);
      border-color: var(--primary);
    }

    .custom-checkbox:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .custom-checkbox::after {
      content: "";
      width: 7px;
      height: 11px;
      border: solid #ffffff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
      display: none;
      margin-top: -2px;
    }

    .custom-checkbox:checked::after {
      display: block;
    }

    /* Task Content (Title & Badges) */
    .task-content {
      flex: 1;
      min-width: 0; /* Prevents overflow in flex */
    }

    .task-title {
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
      line-height: 1.55;
      transition: color 0.15s ease;
      letter-spacing: -0.015em;
    }

    /* Completed strikethrough & dimmed text */
    .task-item.is-completed .task-title {
      color: var(--text-light);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    /* Badges with explicit text & colors */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 600;
      border: 1px solid transparent;
      line-height: 1.35;
      white-space: nowrap;
    }

    /* Priority Badges */
    .badge-priority-high {
      background: var(--priority-high-bg);
      color: var(--priority-high-text);
      border-color: var(--priority-high-border);
    }

    .badge-priority-normal {
      background: var(--priority-normal-bg);
      color: var(--priority-normal-text);
      border-color: var(--priority-normal-border);
    }

    .badge-priority-low {
      background: var(--priority-low-bg);
      color: var(--priority-low-text);
      border-color: var(--priority-low-border);
    }

    /* Status Badges */
    .badge-status-overdue {
      background: var(--status-overdue-bg);
      color: var(--status-overdue-text);
      border-color: var(--status-overdue-border);
      font-weight: 700;
    }

    .badge-status-today {
      background: var(--status-today-bg);
      color: var(--status-today-text);
      border-color: var(--status-today-border);
      font-weight: 700;
    }

    .badge-status-upcoming {
      background: #f8fafc;
      color: #334155;
      border-color: var(--border-color);
    }

    .badge-status-none {
      background: #f8fafc;
      color: #64748b;
      border-color: var(--border-color);
      font-weight: 500;
    }

    .badge-status-completed {
      background: var(--status-done-bg);
      color: var(--status-done-text);
      border-color: var(--status-done-border);
    }

    /* Task Actions (Delete Button) */
    .task-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .delete-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .delete-btn:hover {
      background: #fee2e2;
      border-color: #fecaca;
      color: #dc2626;
    }

    .delete-btn:active {
      transform: scale(0.95);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 56px 24px;
      background: #ffffff;
      border: 1.5px dashed var(--border-color);
      border-radius: var(--radius-lg);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-title {
      font-size: 1.1875rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .empty-desc {
      font-size: 0.9375rem;
      color: var(--text-muted);
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: #1e293b;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: slideIn 0.2s ease-out forwards;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(12px);
      }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 32px 0 16px;
      color: var(--text-light);
      font-size: 0.84375rem;
    }

    /* ==========================================================================
       Mobile & Narrow Screen Optimizations (No cutoffs!)
       ========================================================================== */
    @media (max-width: 640px) {
      .app-container {
        padding: 16px 14px 44px;
      }

      header {
        padding: 20px 18px;
        margin-bottom: 18px;
      }

      .brand {
        gap: 12px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
      }

      .brand-title {
        font-size: 1.375rem;
      }

      .brand-subtitle {
        font-size: 0.84375rem;
      }

      .card {
        padding: 20px 16px;
        margin-bottom: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      .date-shortcuts {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .shortcut-btn {
        width: 100%;
        min-height: 36px;
        font-size: 0.8125rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .filter-tabs-wrapper {
        width: 100%;
        overflow-x: auto;
      }

      .filter-tabs {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }

      .filter-tab {
        flex: 1;
        text-align: center;
        padding: 8px 6px;
        font-size: 0.8125rem;
      }

      .sort-control {
        width: 100%;
        justify-content: space-between;
      }

      .sort-select {
        flex: 1;
      }

      .task-item {
        padding: 16px 14px;
        gap: 12px;
      }

      .task-title {
        font-size: 0.96875rem;
      }

      .badge {
        font-size: 0.75rem;
        padding: 3px 8px;
      }

      .delete-btn {
        width: 32px;
        height: 32px;
      }

      .toast-container {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }

      .toast {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="m9 14 2 2 4-4"></path>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">내 업무 플래너</h1>
            <p class="brand-subtitle">개인 업무와 마감일을 안전하고 체계적으로 관리하세요</p>
          </div>
        </div>

        <!-- Task Stats -->
        <div class="stats-summary" id="statsContainer" aria-label="업무 요약 통계">
          <span class="stat-pill">전체 <strong id="statTotal">0</strong></span>
          <span class="stat-pill">진행 중 <strong id="statActive">0</strong></span>
          <span class="stat-pill pill-today" id="statTodayWrapper">오늘 마감 <strong id="statToday">0</strong></span>
          <span class="stat-pill pill-overdue" id="statOverdueWrapper">기한 지남 <strong id="statOverdue">0</strong></span>
          <span class="stat-pill">완료 <strong id="statCompleted">0</strong></span>
        </div>
      </div>

      <!-- Storage Notice Requirement -->
      <div class="storage-notice" role="note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>이 브라우저에 저장되며 다른 기기와 자동 동기화되지 않습니다.</span>
      </div>
    </header>

    <!-- Storage Error Banner -->
    <div id="storageErrorBanner" class="storage-error-banner" role="alert">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="storageErrorMessage">저장되지 않았습니다. 브라우저 저장공간 또는 설정을 확인해주세요.</span>
    </div>

    <!-- 1. Task Registration Card (명확한 입력 영역 구분) -->
    <section class="card card-registration" aria-labelledby="formTitle">
      <div class="card-header-bar">
        <h2 id="formTitle" class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          새 업무 등록
        </h2>
        <span class="card-badge-pill">업무 입력 영역</span>
      </div>

      <form id="taskForm" novalidate>
        <!-- Task Title -->
        <div class="form-group">
          <label for="taskTitle" class="form-label">
            업무명<span class="required" aria-hidden="true">*</span>
          </label>
          <input
            type="text"
            id="taskTitle"
            class="input-text"
            placeholder="수행할 업무명을 입력하세요 (예: 2분기 예산안 검토, 팀 주간 회의 준비)"
            autocomplete="off"
            maxlength="200"
          />
          <div id="taskTitleError" class="error-feedback" role="alert">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="taskTitleErrorText">업무명을 입력해주세요. 공백만으로는 등록할 수 없습니다.</span>
          </div>
        </div>

        <!-- Priority & Due Date Grid -->
        <div class="form-grid">
          <!-- Priority Selection (Default: 보통) -->
          <div class="form-group">
            <label for="taskPriority" class="form-label">우선순위</label>
            <select id="taskPriority" class="input-select">
              <option value="보통" selected>보통 (기본값)</option>
              <option value="높음">높음 (긴급 / 중요)</option>
              <option value="낮음">낮음 (여유 있음)</option>
            </select>
          </div>

          <!-- Due Date Selection (Optional) -->
          <div class="form-group">
            <label for="taskDueDate" class="form-label">
              마감일<span class="optional">(선택사항 - 미선택 시 ‘마감일 없음’)</span>
            </label>
            <input type="date" id="taskDueDate" class="input-date" />
            <div class="date-shortcuts" aria-label="마감일 빠른 선택">
              <button type="button" class="shortcut-btn" data-date-offset="0">오늘</button>
              <button type="button" class="shortcut-btn" data-date-offset="1">내일</button>
              <button type="button" class="shortcut-btn" data-date-offset="7">1주일 뒤</button>
              <button type="button" class="shortcut-btn clear-btn" id="clearDateBtn">마감일 지우기</button>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" id="submitTaskBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          업무 등록하기
        </button>
      </form>
    </section>

    <!-- 2. Task List Card (명확히 분리된 업무 목록 영역) -->
    <section class="card card-list" aria-labelledby="listTitle">
      <div class="card-header-bar">
        <h2 id="listTitle" class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          업무 목록
        </h2>
        <span class="card-badge-pill" id="listCountBadge">총 0개</span>
      </div>

      <!-- Toolbar: Filters & Sort -->
      <div class="toolbar">
        <!-- Filter Tabs (Horizontal Scroll / Mobile safe) -->
        <div class="filter-tabs-wrapper">
          <div class="filter-tabs" role="tablist" aria-label="업무 상태 필터">
            <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">전체</button>
            <button type="button" class="filter-tab" data-filter="active" role="tab" aria-selected="false">진행 중</button>
            <button type="button" class="filter-tab" data-filter="today" role="tab" aria-selected="false">오늘 마감</button>
            <button type="button" class="filter-tab" data-filter="overdue" role="tab" aria-selected="false">기한 지남</button>
            <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false">완료됨</button>
          </div>
        </div>

        <!-- Sort Select -->
        <div class="sort-control">
          <label for="sortSelect" class="sort-label">정렬:</label>
          <select id="sortSelect" class="sort-select" aria-label="업무 정렬 방식">
            <option value="created-desc">최신 등록순</option>
            <option value="due-asc">마감일 빠른순</option>
            <option value="priority-desc">우선순위 높은순</option>
            <option value="title-asc">업무명 가나다순</option>
          </select>
        </div>
      </div>

      <!-- Task Items Container -->
      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 14 14"></polyline>
          </svg>
        </div>
        <h3 class="empty-title" id="emptyTitle">등록된 업무가 없습니다</h3>
        <p class="empty-desc" id="emptyDesc">상단 등록창에서 새로운 업무를 추가하고 체계적으로 관리해보세요.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>내 업무 플래너 &bull; 브라우저 로컬 저장소 기반</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      // LocalStorage Key - Must match existing to preserve user's data!
      const STORAGE_KEY = 'my_work_planner_tasks_v1';

      // State
      let tasks = [];
      let currentFilter = 'all';
      let currentSort = 'created-desc';

      // DOM Elements
      const taskForm = document.getElementById('taskForm');
      const taskTitleInput = document.getElementById('taskTitle');
      const taskTitleError = document.getElementById('taskTitleError');
      const taskTitleErrorText = document.getElementById('taskTitleErrorText');
      const taskPrioritySelect = document.getElementById('taskPriority');
      const taskDueDateInput = document.getElementById('taskDueDate');
      const clearDateBtn = document.getElementById('clearDateBtn');
      const shortcutButtons = document.querySelectorAll('.shortcut-btn[data-date-offset]');
      
      const taskList = document.getElementById('taskList');
      const emptyState = document.getElementById('emptyState');
      const emptyTitle = document.getElementById('emptyTitle');
      const emptyDesc = document.getElementById('emptyDesc');
      const listCountBadge = document.getElementById('listCountBadge');
      
      const filterTabs = document.querySelectorAll('.filter-tab');
      const sortSelect = document.getElementById('sortSelect');
      
      const storageErrorBanner = document.getElementById('storageErrorBanner');
      const storageErrorMessage = document.getElementById('storageErrorMessage');
      const toastContainer = document.getElementById('toastContainer');

      // Stat elements
      const statTotal = document.getElementById('statTotal');
      const statActive = document.getElementById('statActive');
      const statToday = document.getElementById('statToday');
      const statTodayWrapper = document.getElementById('statTodayWrapper');
      const statOverdue = document.getElementById('statOverdue');
      const statOverdueWrapper = document.getElementById('statOverdueWrapper');
      const statCompleted = document.getElementById('statCompleted');

      // --- Date Helpers (User's Local Date) ---
      function getLocalTodayString(dateObj = new Date()) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function formatDisplayDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return `${parts[0]}.${parts[1]}.${parts[2]}`;
        }
        return dateStr;
      }

      function calculateDDay(dueDateStr, todayStr) {
        const due = new Date(dueDateStr + 'T00:00:00');
        const today = new Date(todayStr + 'T00:00:00');
        const diffTime = due - today;
        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
        if (diffDays === 0) return 'D-Day';
        if (diffDays > 0) return `D-${diffDays}`;
        return `D+${Math.abs(diffDays)}`;
      }

      // --- Storage Helper Functions ---
      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              tasks = parsed;
            } else {
              tasks = [];
            }
          } else {
            tasks = [];
          }
          hideStorageError();
        } catch (err) {
          console.error('Failed to load tasks from localStorage', err);
          tasks = [];
          showStorageError('저장된 업무를 불러오는 데 실패했습니다.');
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          hideStorageError();
          return true;
        } catch (err) {
          console.error('Failed to save tasks to localStorage', err);
          showStorageError('저장되지 않았습니다. 브라우저 용량이나 보안 설정을 확인해주세요.');
          return false;
        }
      }

      function showStorageError(message) {
        if (storageErrorMessage) {
          storageErrorMessage.textContent = message || '저장되지 않았습니다.';
        }
        if (storageErrorBanner) {
          storageErrorBanner.classList.add('show');
        }
      }

      function hideStorageError() {
        if (storageErrorBanner) {
          storageErrorBanner.classList.remove('show');
        }
      }

      // Toast feedback helper
      function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>${escapeHTML(message)}</span>
        `;
        toastContainer.appendChild(toast);

        setTimeout(() => {
          toast.style.animation = 'fadeOut 0.25s ease-out forwards';
          setTimeout(() => {
            if (toast.parentNode) {
              toast.parentNode.removeChild(toast);
            }
          }, 250);
        }, 2200);
      }

      // Safe HTML escaping
      function escapeHTML(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Unique ID Generator
      function generateId() {
        if (typeof crypto !== 'undefined' && crypto.randomUUID) {
          return crypto.randomUUID();
        }
        return 'task_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
      }

      // --- Task Validation ---
      function validateTaskTitle(title) {
        if (!title || title.trim().length === 0) {
          return {
            isValid: false,
            message: '업무명을 입력해주세요. 공백만으로는 등록할 수 없습니다.'
          };
        }
        return { isValid: true };
      }

      function showTitleError(message) {
        taskTitleInput.classList.add('has-error');
        taskTitleErrorText.textContent = message;
        taskTitleError.classList.add('show');
        taskTitleInput.focus();
      }

      function clearTitleError() {
        taskTitleInput.classList.remove('has-error');
        taskTitleError.classList.remove('show');
      }

      // --- Add Task Handler ---
      taskForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const titleRaw = taskTitleInput.value;
        const validation = validateTaskTitle(titleRaw);

        if (!validation.isValid) {
          showTitleError(validation.message);
          return;
        }

        clearTitleError();

        const priority = taskPrioritySelect.value || '보통';
        const dueDate = taskDueDateInput.value.trim() || null;

        const newTask = {
          id: generateId(),
          title: titleRaw.trim(),
          priority: priority, // '높음' | '보통' | '낮음'
          dueDate: dueDate,   // 'YYYY-MM-DD' or null
          completed: false,
          createdAt: new Date().toISOString()
        };

        // Add to front of array
        tasks.unshift(newTask);

        const saved = saveTasks();
        if (saved) {
          showToast('새 업무가 등록되었습니다.');
        }

        // Reset form
        taskTitleInput.value = '';
        taskPrioritySelect.value = '보통';
        taskDueDateInput.value = '';
        taskTitleInput.focus();

        render();
      });

      // Clear error on typing
      taskTitleInput.addEventListener('input', function () {
        if (taskTitleInput.classList.contains('has-error')) {
          if (taskTitleInput.value.trim().length > 0) {
            clearTitleError();
          }
        }
      });

      // --- Date Shortcut Buttons ---
      shortcutButtons.forEach(btn => {
        btn.addEventListener('click', function () {
          const offsetDays = parseInt(this.getAttribute('data-date-offset'), 10);
          const target = new Date();
          target.setDate(target.getDate() + offsetDays);
          taskDueDateInput.value = getLocalTodayString(target);
        });
      });

      clearDateBtn.addEventListener('click', function () {
        taskDueDateInput.value = '';
      });

      // --- Toggle Completion ---
      function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        task.completed = !task.completed;
        const saved = saveTasks();
        if (saved) {
          showToast(task.completed ? '업무를 완료했습니다.' : '업무 완료를 취소했습니다.');
        }
        render();
      }

      // --- Delete Task ---
      function deleteTask(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        const confirmDelete = window.confirm(`"${task.title}" 업무를 삭제하시겠습니까?`);
        if (!confirmDelete) return;

        tasks = tasks.filter(t => t.id !== id);
        const saved = saveTasks();
        if (saved) {
          showToast('업무가 삭제되었습니다.');
        }
        render();
      }

      // --- Filter Tabs ---
      filterTabs.forEach(tab => {
        tab.addEventListener('click', function () {
          filterTabs.forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          this.classList.add('active');
          this.setAttribute('aria-selected', 'true');
          currentFilter = this.getAttribute('data-filter');
          render();
        });
      });

      // --- Sort Select ---
      sortSelect.addEventListener('change', function () {
        currentSort = this.value;
        render();
      });

      // --- Task Status Evaluation (Date Rules) ---
      function evaluateTaskDateStatus(task, todayStr) {
        if (!task.dueDate) {
          return { type: 'none', label: '마감일 없음', cssClass: 'badge-status-none' };
        }

        if (task.completed) {
          return {
            type: 'completed',
            label: `마감: ${formatDisplayDate(task.dueDate)}`,
            cssClass: 'badge-status-completed'
          };
        }

        if (task.dueDate < todayStr) {
          return {
            type: 'overdue',
            label: `⚠️ 기한 지남 (${formatDisplayDate(task.dueDate)})`,
            cssClass: 'badge-status-overdue',
            isOverdue: true
          };
        } else if (task.dueDate === todayStr) {
          return {
            type: 'today',
            label: `🔥 오늘 마감 (${formatDisplayDate(task.dueDate)})`,
            cssClass: 'badge-status-today',
            isToday: true
          };
        } else {
          const dday = calculateDDay(task.dueDate, todayStr);
          return {
            type: 'upcoming',
            label: `📅 마감: ${formatDisplayDate(task.dueDate)} (${dday})`,
            cssClass: 'badge-status-upcoming'
          };
        }
      }

      // Priority Badge Info with clear text: '높음', '보통', '낮음'
      function getPriorityBadgeInfo(priority) {
        switch (priority) {
          case '높음':
            return {
              label: '높음',
              dot: '🔴',
              cssClass: 'badge-priority-high'
            };
          case '낮음':
            return {
              label: '낮음',
              dot: '🟢',
              cssClass: 'badge-priority-low'
            };
          case '보통':
          default:
            return {
              label: '보통',
              dot: '🔵',
              cssClass: 'badge-priority-normal'
            };
        }
      }

      // Priority sort weight
      const priorityWeights = {
        '높음': 3,
        '보통': 2,
        '낮음': 1
      };

      // --- Render Function ---
      function render() {
        const todayStr = getLocalTodayString();

        // 1. Update Statistics
        let totalCount = tasks.length;
        let completedCount = 0;
        let activeCount = 0;
        let todayCount = 0;
        let overdueCount = 0;

        tasks.forEach(t => {
          if (t.completed) {
            completedCount++;
          } else {
            activeCount++;
            if (t.dueDate) {
              if (t.dueDate === todayStr) {
                todayCount++;
              } else if (t.dueDate < todayStr) {
                overdueCount++;
              }
            }
          }
        });

        statTotal.textContent = totalCount;
        statActive.textContent = activeCount;
        statToday.textContent = todayCount;
        statOverdue.textContent = overdueCount;
        statCompleted.textContent = completedCount;

        // Visual emphasis when today or overdue items exist
        if (todayCount > 0) {
          statTodayWrapper.style.display = 'inline-flex';
        }
        if (overdueCount > 0) {
          statOverdueWrapper.style.display = 'inline-flex';
        }

        // 2. Filter tasks
        let filtered = tasks.filter(task => {
          if (currentFilter === 'active') return !task.completed;
          if (currentFilter === 'completed') return task.completed;
          if (currentFilter === 'today') {
            return !task.completed && task.dueDate === todayStr;
          }
          if (currentFilter === 'overdue') {
            return !task.completed && task.dueDate && task.dueDate < todayStr;
          }
          return true; // 'all'
        });

        // Update list badge count
        listCountBadge.textContent = `총 ${filtered.length}개`;

        // 3. Sort tasks
        filtered.sort((a, b) => {
          if (currentSort === 'created-desc') {
            return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
          }
          if (currentSort === 'priority-desc') {
            const weightA = priorityWeights[a.priority] || 2;
            const weightB = priorityWeights[b.priority] || 2;
            if (weightB !== weightA) return weightB - weightA;
            return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
          }
          if (currentSort === 'due-asc') {
            if (!a.dueDate && !b.dueDate) return 0;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          }
          if (currentSort === 'title-asc') {
            return a.title.localeCompare(b.title, 'ko');
          }
          return 0;
        });

        // 4. Render Task List or Empty State
        taskList.innerHTML = '';

        if (filtered.length === 0) {
          emptyState.style.display = 'block';
          if (tasks.length === 0) {
            emptyTitle.textContent = '등록된 업무가 없습니다';
            emptyDesc.textContent = '상단 등록창에서 새로운 업무를 추가하고 체계적으로 관리해보세요.';
          } else {
            emptyTitle.textContent = '해당 조건의 업무가 없습니다';
            emptyDesc.textContent = '선택한 필터에 해당하는 업무가 없습니다. 다른 탭을 선택해보세요.';
          }
        } else {
          emptyState.style.display = 'none';

          filtered.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'is-completed' : ''}`;
            li.dataset.id = task.id;

            const dateStatus = evaluateTaskDateStatus(task, todayStr);
            const priorityInfo = getPriorityBadgeInfo(task.priority);

            li.innerHTML = `
              <div class="checkbox-container">
                <input
                  type="checkbox"
                  class="custom-checkbox"
                  id="chk_${task.id}"
                  ${task.completed ? 'checked' : ''}
                  aria-label="${escapeHTML(task.title)} 완료 여부"
                />
              </div>

              <div class="task-content">
                <div class="task-title">${escapeHTML(task.title)}</div>
                <div class="task-meta">
                  <span class="badge ${priorityInfo.cssClass}">
                    ${priorityInfo.dot} 우선순위: ${priorityInfo.label}
                  </span>
                  <span class="badge ${dateStatus.cssClass}">
                    ${escapeHTML(dateStatus.label)}
                  </span>
                  ${task.completed ? '<span class="badge badge-status-completed">✓ 완료됨</span>' : ''}
                </div>
              </div>

              <div class="task-actions">
                <button
                  type="button"
                  class="delete-btn"
                  title="업무 삭제"
                  aria-label="${escapeHTML(task.title)} 삭제"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            `;

            // Event Listeners for this item
            const checkbox = li.querySelector('.custom-checkbox');
            checkbox.addEventListener('change', () => toggleTask(task.id));

            const delBtn = li.querySelector('.delete-btn');
            delBtn.addEventListener('click', () => deleteTask(task.id));

            taskList.appendChild(li);
          });
        }
      }

      // Initial Load and Render
      loadTasks();
      render();

    })();
  </script>
</body>
</html>
